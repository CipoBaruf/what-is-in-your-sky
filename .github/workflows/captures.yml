name: Captures

# FR-CI-2 (R37, D-195): the v1 capture set (D-179) is not a pull request's
# business. Sixty screenshots off one build cost about 8.5 min, which was most
# of the PR budget FR-CI-1 sets, and a PR that changes a screen ships its own
# captures through the `visual-review` skill anyway. So the set is shot here:
# on every push to `main` and on demand.
#
# R53: the set is 92 files since v1.1 gave it the settings page, the sky window
# and the legend, so the run is about half as long again — call it 13 min on a
# two-core runner.
#
# R60: the set is 128 files since v1.2 topped it up with the window's ground
# states, the live page following and R61's wide sizes — call it 18 min.
#
# R65: 116 since v1.3 replaced the live page's following state and the pass
# detail's three window screens with the sky screen's four (FR-FSC-7, D-346) —
# fewer files than v1.2 and three screens more.
#
# R72: 124 since v1.4 gave the live page two widths it had never been shot at —
# 1024 × 768 (FR-SHP-5) and 1200 × 450, the window dragged short that F-65 was
# about — so call it 17 min. No screen was added: the eight files are one
# screen's two widths in both themes and both languages.
#
# R80: 161 since v2.0 split the live page into its two states (FR-WATCH-9 f) —
# `live-watching` and `live-scrubbing` at the eight widths `live` had, so the
# set grows by one screen's worth of files and no screen is added or dropped.
# Call it 22 min. The redesign changed the cold open, the home, the settings
# page and the sky screen without changing what the set names them.
#
# R94: 254 since v2.1 asked what a capture shows (SPEC §4.39, FR-CAP-1..5,
# FR-TAB-3; D-610) — a `-view` twin of the home at every width (the true state,
# tonight open and the dome drawn, cropped to the viewport), a 360 px column
# beside every 390 one, a 768 px column for the home, the guide, both live
# states and settings, and the home at 1920. Re-measured off one build on a
# ten-core machine: 2.5 s a capture, about 3 min whole. R80's 22 min for 161
# files on this two-core runner scales to about 35 min, so the ceiling is 60.
# FR-CAP-5 is stated over this workflow: two runs on one commit must produce
# byte-identical files, and every capture waits for a settled frame first.
#
# R118: 274 since v2.4 added the stars page at four widths and its sky screen at 844.
#
# R128: 330 since v2.5 added FR-SKY-9's files — the window on the live page and the pass detail
# at 360, 390, 1280 and 1920, the window following the pass and the stars page zoomed in at 1280,
# the stars page with `[ passes ]` at 360, 390 and 1280 and the screen it opens at 844. Locally
# (ten cores) the set takes about 2.7 min, so the 60 min ceiling stands. And the run says what it
# moved: the `base` input (PLAN D-742, a SHA and never a tag) names the commit whose committed set
# the run compares against, and the last step lists every file that differs from it — new, changed
# or gone — in the job summary. With no input (every push to `main`, or a dispatch left empty) the
# base is the commit itself, so the list is the drift from the set that commit carries; a release
# dispatches with its previous release's SHA (v2.5: `ece8bfd`, v2.4's release preparation), so no
# literal here has to change from one release to the next.
#
# This job commits nothing. It uploads the set as an artefact and fails when a
# capture is missing — the committed files under `docs/screenshots/` are cleared
# before the run, so the check is about what this run produced and not about
# what someone committed last month. `tests/docs/captures.test.ts` keeps
# checking the committed set in the unit suite, which is the other half of it.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: The commit the set is compared against (PLAN D-742, a SHA, never a tag); empty is the commit being shot
        required: false
        default: ''

jobs:
  captures:
    runs-on: ubuntu-latest
    # About 1.7 × the expected 35 min (R94, from R80's measured 22 min for 161 files): this job is off the
    # PR path, so its ceiling is a stuck run, not a budget (FR-CI-1 is `ci.yml`'s).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # The base's committed set is read with `git show`, so the history must be there.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The spec runs against the production build served by `vite preview` (playwright.config.ts).
      - run: npm run build
      # A capture that fails to be written must not be answered by the file the last run left behind.
      - name: clear the committed set
        run: find docs/screenshots -name 'v1-*.png' -delete
      - name: clear the design captures
        run: find docs/screenshots/design -name 'design-*.png' -delete
      - name: shoot the set
        env:
          CAPTURES: '1'
        run: npx playwright test v1-captures --reporter=list
      # R108 (FR-DS-6, D-706): the dev page's four captures, after the set. The page is not in the
      # build, so `playwright.design.config.ts` serves it with `vite` itself; the files join the
      # set's diff (FR-CAP-1's rule), so a token's or a primitive's change is visible in review
      # before any screen is touched. Cleared with the set, up front, so a failed set shoot never
      # leaves the committed files to be uploaded as this run's.
      - name: shoot the design captures
        run: npm run design:captures
      # FR-CI-2: incomplete is a failure. The same check the unit suite runs, now against this run's files.
      - name: check the set is complete
        run: npx vitest run tests/docs/captures.test.ts
      # R128 (PLAN D-742, D-799): the release's diff list, this run's files against the base's committed
      # ones, with the changed pixels and the largest channel step of each so F-99's noise reads as noise.
      # A push to `main` has no input and compares against its own commit. `shell: bash` is GitHub's
      # `bash -eo pipefail`: without it the default shell has no pipefail, `tee` answers for the pipe, and a
      # failing script (a base that does not resolve, a bad PNG) would leave the step green with a short list.
      # `pngjs` is a direct devDependency for this step, not one reached through glyphcss (`knip.json` ignores it:
      # this script is its only importer).
      - name: diff against the base
        if: always()
        shell: bash
        env:
          BASE: ${{ inputs.base || github.sha }}
        run: |
          node --input-type=module <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import { execFileSync } from 'node:child_process';
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          import { PNG } from 'pngjs';
          const base = process.env.BASE;
          const dir = 'docs/screenshots';
          const listed = execFileSync('git', ['ls-tree', '--name-only', base, `${dir}/`]).toString().split('\n').filter((f) => /\/v1-[^/]*\.png$/.test(f));
          const before = new Map(listed.map((f) => [f.slice(dir.length + 1), f]));
          const now = readdirSync(dir).filter((f) => /^v1-.*\.png$/.test(f)).sort();
          const rows = [];
          let same = 0;
          for (const file of now) {
            if (!before.has(file)) { rows.push(`| new | ${file} | | |`); continue; }
            const a = execFileSync('git', ['show', `${base}:${before.get(file)}`], { maxBuffer: 1 << 28 });
            const b = readFileSync(`${dir}/${file}`);
            if (a.equals(b)) { same += 1; continue; }
            const p = PNG.sync.read(a);
            const q = PNG.sync.read(b);
            if (p.width !== q.width || p.height !== q.height) { rows.push(`| size | ${file} | ${p.width}×${p.height} → ${q.width}×${q.height} | |`); continue; }
            let pixels = 0;
            let step = 0;
            for (let i = 0; i < p.data.length; i += 4) {
              let d = 0;
              for (let c = 0; c < 4; c += 1) d = Math.max(d, Math.abs(p.data[i + c] - q.data[i + c]));
              if (d > 0) { pixels += 1; step = Math.max(step, d); }
            }
            if (pixels === 0) same += 1;
            else rows.push(`| changed | ${file} | ${pixels} | ${step} |`);
          }
          for (const file of before.keys()) if (!existsSync(`${dir}/${file}`)) rows.push(`| gone | ${file} | | |`);
          console.log(`### The set against \`${base}\`\n\n${now.length} files: ${same} byte- or pixel-identical, ${rows.length} listed.\n`);
          console.log('| | File | Pixels | Step |\n|---|---|---|---|');
          for (const row of rows) console.log(row);
          EOF
      - uses: actions/upload-artifact@v5
        # Even on a failure: the captures that were shot are how the missing one gets diagnosed.
        if: always()
        with:
          name: v1-captures
          path: docs/screenshots/v1-*.png
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: design-captures
          path: docs/screenshots/design/design-*.png
          retention-days: 30
          if-no-files-found: error

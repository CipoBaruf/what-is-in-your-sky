name: Captures

# FR-CI-2 (R37, D-195): the v1 capture set (D-179) is not a pull request's
# business. Sixty screenshots off one build cost about 8.5 min, which was most
# of the PR budget FR-CI-1 sets, and a PR that changes a screen ships its own
# captures through the `visual-review` skill anyway. So the set is shot here:
# on every push to `main` and on demand.
#
# R53: the set is 92 files since v1.1 gave it the settings page, the sky window
# and the legend, so the run is about half as long again — call it 13 min on a
# two-core runner.
#
# R60: the set is 128 files since v1.2 topped it up with the window's ground
# states, the live page following and R61's wide sizes — call it 18 min.
#
# R65: 116 since v1.3 replaced the live page's following state and the pass
# detail's three window screens with the sky screen's four (FR-FSC-7, D-346) —
# fewer files than v1.2 and three screens more.
#
# R72: 124 since v1.4 gave the live page two widths it had never been shot at —
# 1024 × 768 (FR-SHP-5) and 1200 × 450, the window dragged short that F-65 was
# about — so call it 17 min. No screen was added: the eight files are one
# screen's two widths in both themes and both languages.
#
# R80: 161 since v2.0 split the live page into its two states (FR-WATCH-9 f) —
# `live-watching` and `live-scrubbing` at the eight widths `live` had, so the
# set grows by one screen's worth of files and no screen is added or dropped.
# Call it 22 min. The redesign changed the cold open, the home, the settings
# page and the sky screen without changing what the set names them.
#
# R94: 254 since v2.1 asked what a capture shows (SPEC §4.39, FR-CAP-1..5,
# FR-TAB-3; D-610) — a `-view` twin of the home at every width (the true state,
# tonight open and the dome drawn, cropped to the viewport), a 360 px column
# beside every 390 one, a 768 px column for the home, the guide, both live
# states and settings, and the home at 1920. Re-measured off one build on a
# ten-core machine: 2.5 s a capture, about 3 min whole. R80's 22 min for 161
# files on this two-core runner scales to about 35 min, so the ceiling is 60.
# FR-CAP-5 is stated over this workflow: two runs on one commit must produce
# byte-identical files, and every capture waits for a settled frame first.
#
# R118: 274 since v2.4 added the stars page at four widths and its sky screen at 844.
#
# R128: 330 since v2.5 added FR-SKY-9's files — the window on the live page and the pass detail
# at 360, 390, 1280 and 1920, the window following the pass and the stars page zoomed in at 1280,
# the stars page with `[ passes ]` at 360, 390 and 1280 and the screen it opens at 844. Locally
# (ten cores) the set takes about 2.7 min, so the 60 min ceiling stands. And the run says what it
# moved: the `base` input (PLAN D-742, a SHA and never a tag) names the commit whose committed set
# the run compares against, and the last step lists every file that differs from it — new, changed
# or gone — in the job summary. With no input (every push to `main`, or a dispatch left empty) the
# base is the commit itself, so the list is the drift from the set that commit carries; a release
# dispatches with its previous release's SHA (v2.5: `ece8bfd`, v2.4's release preparation), so no
# literal here has to change from one release to the next.
#
# R135: 386 since v2.6 added FR-FLOW-12's files — the home's doors up now, with no pass and in
# daylight at 360, 390, 1280 and 1920 (the later pass is the home's `-view` twin), the compact Where
# opened at 360 and 390, and the pass detail and the stars page turned at 844 × 390 — and retired
# `live-window` at 360 and 390, which a phone opening on the window made `live-watching`'s picture. v2.6 dispatches
# with `base` 89a8e5b, v2.5's release preparation.
#
# R178 (FR-SDD-22, FR-SDD-23; PLAN D-1068): the set leaves `main`'s history for the orphan `captures` branch,
# which mirrors `docs/screenshots/`'s layout (the `v1-*.png` files at its root) and is squashed at each release.
# The `pick` job reads `scripts/captures/manifest.json` through `node scripts/ci-affected.ts --captures`: a push to
# `main` shoots only the screens its diff reaches, and no screen means no `captures` job at all. The diff runs from the commit the branch records in `SOURCE_SHA` (the `main` commit it was last shot from) to the run's,
# so a failed, skipped or cancelled run is made up by the next. A dispatch shoots the screens its `screens` input names,
# or the whole set when that is empty (release prep); with no branch or no recorded commit every event shoots the whole
# set. A run with named screens leaves `SOURCE_SHA` where it was. The `captures` job restores the branch's set into `docs/screenshots/`,
# clears the files of the screens it shoots (a capture that fails to be written must not be answered by the file
# the last run left), shoots them compressed, checks the set is complete, and diffs it against the branch by pixels
# (`scripts/captures/diff.ts`): every capture past `CAPTURE_DIFF_SHARE` gets one image, base and this run side by
# side at half size. On `main` the set and those images (under `diff/`) are committed to the branch and the job
# summary shows the images from that commit; a dispatch on another ref commits nothing and uploads them instead.
# `squash: true` (the release) replaces the branch's history with the one commit. R128's `base` input is gone: the
# base is always the branch, which holds the set the last run on `main` left.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      screens:
        description: Comma-separated screen names from tests/e2e/captureSet.ts; empty shoots the whole set
        required: false
        default: ''
      squash:
        description: Replace the captures branch's history with this run's one commit (release prep)
        type: boolean
        required: false
        default: false

# One writer to the `captures` branch at a time; a queued run waits rather than racing the push.
concurrency:
  group: captures-branch
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      captures: ${{ steps.pick.outputs.captures }}
      capture_screens: ${{ steps.pick.outputs.capture_screens }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # ci-affected.ts imports nothing outside Node, so this job needs no `npm ci`.
      - name: the screens to shoot
        id: pick
        shell: bash
        env:
          SCREENS: ${{ inputs.screens }}
        run: |
          # The branch records the `main` commit its set was last shot from (`SOURCE_SHA`), so a failed, skipped or
          # cancelled run is made up by the next one: the diff is from that commit to this run's, not from the push's
          # BEFORE. No branch, no recorded commit, or one this history does not lead on from: the whole set, a dispatch too.
          full() {
            echo "$1: the whole set"
            printf 'captures=all\ncapture_screens=\n' | tee -a "$GITHUB_OUTPUT"
          }
          if ! git fetch --quiet origin captures 2> /dev/null; then
            full 'the captures branch does not exist yet'
            exit 0
          fi
          recorded=$(git show FETCH_HEAD:SOURCE_SHA 2> /dev/null | tr -d '[:space:]' || true)
          if [ -z "$recorded" ] || ! git cat-file -e "$recorded^{commit}" 2> /dev/null; then
            full 'the captures branch records no usable source commit'
          elif ! git merge-base --is-ancestor "$recorded" "$GITHUB_SHA"; then
            full "the recorded source $recorded is not behind this run"
          elif [ -n "$SCREENS" ]; then
            printf 'captures=some\ncapture_screens=%s\n' "$SCREENS" | tee -a "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            printf 'captures=all\ncapture_screens=\n' | tee -a "$GITHUB_OUTPUT"
          else
            node scripts/ci-affected.ts --captures "$recorded" "$GITHUB_SHA"
          fi

  captures:
    needs: pick
    if: needs.pick.outputs.captures != 'none'
    runs-on: ubuntu-latest
    # About 1.7 × the expected 35 min for the whole set (R94, from R80's measured 22 min for 161 files): this job is
    # off the PR path, so its ceiling is a stuck run, not a budget (FR-CI-1 is `ci.yml`'s).
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MODE: ${{ needs.pick.outputs.captures }}
      CAPTURE_SCREENS: ${{ needs.pick.outputs.capture_screens }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The spec runs against the production build served by `vite preview` (playwright.config.ts).
      - run: npm run build
      # The branch's set is the base: restored into `docs/screenshots/` so the set is whole after a partial run,
      # and kept apart under `base/` for the diff. No branch yet is an empty base.
      - name: restore the set from the captures branch
        shell: bash
        run: |
          mkdir -p base
          if git fetch --quiet origin captures; then
            git archive FETCH_HEAD | tar -x -C base
            rm -rf base/diff base/README.md base/SOURCE_SHA
          fi
          find base -maxdepth 1 -name 'v1-*.png' -exec cp {} docs/screenshots/ \;
          echo "base: $(find base -name 'v1-*.png' | wc -l) files"
      # A capture that fails to be written must not be answered by the file the last run left behind.
      - name: clear the files this run shoots
        shell: bash
        run: |
          if [ "$MODE" = all ]; then
            find docs/screenshots -maxdepth 1 -name 'v1-*.png' -delete
          else
            IFS=',' read -ra names <<< "$CAPTURE_SCREENS"
            for name in "${names[@]}"; do find docs/screenshots -maxdepth 1 -name "v1-$name-[0-9]*.png" -delete; done
          fi
      - name: clear the design captures
        run: find docs/screenshots/design -name 'design-*.png' -delete
      - name: shoot the set
        env:
          CAPTURES: '1'
        run: npx playwright test v1-captures --reporter=list
      # R108 (FR-DS-6, D-706): the dev page's four captures. They stay on `main` (docs/DESIGN.md shows them), so
      # this run only shoots them for the artefact; a change to them ships with the task that made it.
      - name: shoot the design captures
        run: npm run design:captures
      # FR-CI-2: incomplete is a failure. `CAPTURES_SET=1` holds the restored-and-shot directory to the whole set.
      - name: check the set is complete
        env:
          CAPTURES_SET: '1'
        run: npx vitest run tests/docs/captures.test.ts
      # FR-SDD-23: by pixels first. The side-by-side images go to `sides/`; the report's image links carry a
      # placeholder until the commit that holds them exists.
      - name: diff against the branch
        if: always()
        shell: bash
        run: |
          mkdir -p set sides
          find docs/screenshots -maxdepth 1 -name 'v1-*.png' -exec cp {} set/ \;
          npx tsx scripts/captures/diff.ts base set --out sides --url '@URL@' --title "The set against the captures branch ($MODE)" > report.md
      - name: commit to the captures branch
        id: publish
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SQUASH: ${{ inputs.squash }}
          SCREENS: ${{ inputs.screens }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$SQUASH" != true ] && git ls-remote --exit-code --heads origin captures > /dev/null; then
            git fetch --quiet origin captures
            git worktree add -B captures ../publish FETCH_HEAD
          else
            git worktree add --detach ../publish
            git -C ../publish switch --orphan captures
          fi
          cd ../publish
          find . -maxdepth 1 -name 'v1-*.png' -delete
          rm -rf diff
          cp "$GITHUB_WORKSPACE"/set/v1-*.png .
          mkdir -p diff
          cp -R "$GITHUB_WORKSPACE"/sides/. diff/
          # A run that shot named screens only does not move the recorded commit: the screens skipped before it are still owed.
          if [ -z "$SCREENS" ]; then echo "$GITHUB_SHA" > SOURCE_SHA; fi
          printf '# Captures\n\nThe capture set (`tests/e2e/captureSet.ts`), shot by `.github/workflows/captures.yml` off `main` (PLAN D-1068). `diff/` holds the last run'"'"'s side-by-side images, base on the left. Squashed at each release.\n' > README.md
          git add -A
          if git diff --cached --quiet; then
            echo 'the set is unchanged'
          else
            git commit --quiet -m "captures: $GITHUB_SHA ($MODE)"
            if [ "$SQUASH" = true ]; then git push --force origin captures; else git push origin captures; fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: the job summary
        if: always()
        shell: bash
        env:
          PUBLISHED: ${{ steps.publish.outputs.sha }}
        run: |
          [ -f report.md ] || exit 0
          if [ -n "$PUBLISHED" ]; then
            sed "s#@URL@#https://github.com/$GITHUB_REPOSITORY/raw/$PUBLISHED/diff#g" report.md >> "$GITHUB_STEP_SUMMARY"
          else
            sed 's#!\[\([^]]*\)\](@URL@/[^)]*)#`\1` in the side-by-side artefact#' report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v5
        # Even on a failure: the captures that were shot are how the missing one gets diagnosed.
        if: always()
        with:
          name: v1-captures
          path: docs/screenshots/v1-*.png
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: side-by-side
          path: sides/
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: design-captures
          path: docs/screenshots/design/design-*.png
          retention-days: 30
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # PLAN §11: typecheck → lint → unit + golden + component + worker integration → build → Playwright.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Chromium is needed by `npm test` too: the Vitest browser project boots the real worker (R5).
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      # PLAN §11 bundle budgets (R15): a table of gzipped chunk sizes, an annotation on overrun, never a failure.
      - run: npm run bundle:budget
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: Live contract

# PLAN §9.1 / §11 (R11): once a day, the `LIVE=1` suite checks that CelesTrak and
# Open-Meteo still answer in the shape the app parses, that every catalog object
# is still in `visual` or `stations`, and that the CORS header is still `*`.
# It never blocks a merge; a failure opens (or comments on) an issue.
on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: live
        run: LIVE=1 npx vitest run --project live 2>&1 | tee live.log
        continue-on-error: true
      - name: Open or update the issue on failure
        if: steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live contract failed: CelesTrak / Open-Meteo"
          body="The scheduled live contract suite failed: $RUN_URL

          \`\`\`
          $(tail -n 60 live.log)
          \`\`\`"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label live-contract --body "$body" || gh issue create --title "$title" --body "$body"
          fi
      - name: Fail the run so the badge is honest
        if: steps.live.outcome == 'failure'
        run: exit 1

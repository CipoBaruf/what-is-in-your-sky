<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <!-- D-70: `lang` and the title are English here and corrected by `main.tsx` in the same tick, before the first render (FR-I18N-5). -->
    <title>What is in your sky right now</title>
    <!-- R25 (FR-OFF-6): the manifest is hand-written in `public/`, not generated, and is not
         localised — one name in one language, whichever language the page is showing. Safari
         installs from the `apple-touch-icon` instead of the manifest's icons, so the 192 px one
         is named here as well; the "Add to Home Screen" note that goes with it is R28's. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- R74 (FR-MARK-4 e, D-460): the favicon, the mark's scene drawn as dots. The SVG goes first
         and carries the light/dark swap in its own stylesheet; the two PNGs are the fallback for
         browsers without SVG favicons. All three and the manifest icons come from
         `npm run build:icons`, which is why there is no `.ico`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
